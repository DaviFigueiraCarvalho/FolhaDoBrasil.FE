server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Arquivos do export têm hash no nome: cache longo. HTML nunca é cacheado.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
